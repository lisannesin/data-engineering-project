services:

  db:
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: woocommerce-db

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - ./init:/docker-entrypoint-initdb.d
      -  pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.app

    container_name: woocommerce-pipeline

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./scripts:/app/scripts

    working_dir: /app

    command: ["python", "scripts/main.py"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app

    container_name: woocommerce-dashboard

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8501:8501"

    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0"
      ]

volumes:
  pgdata: